version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: cachemind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cachemind-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
      - LLAMA_CPP_BASE_URL=${LLAMA_CPP_BASE_URL:-http://localhost:8080}
      - USE_MOCK_LLM_IF_UNAVAILABLE=true
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  api:
    extends:
      service: backend
    container_name: cachemind-api

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cachemind-worker
    command: ["python", "-m", "backend.app.workers.worker"]
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
      - USE_MOCK_LLM_IF_UNAVAILABLE=true
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: cachemind-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cachemind_data:
  redis_data:
