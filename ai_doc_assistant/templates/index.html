<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseAI | Document Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-grad-1: #0f172a;
            --bg-grad-2: #1e1b4b;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: grid;
            grid-template-columns: 350px 1fr;
            min-height: 80vh;
        }

        .sidebar {
            padding: 2rem;
            border-right: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(to right, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .upload-zone {
            border: 2px dashed var(--glass-border);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            BACKGROUND: rgba(255,255,255,0.02);
        }

        .upload-zone:hover {
            border-color: var(--accent);
            background: rgba(139, 92, 246, 0.1);
        }

        .card-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .doc-item {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .doc-item:hover, .doc-item.active {
            border-color: var(--accent);
            background: rgba(139, 92, 246, 0.15);
            transform: translateX(4px);
        }

        .main-content {
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            overflow-y: auto;
            max-height: 80vh;
        }

        .panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.2);
            color: #fff;
            margin-bottom: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.outline {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
        }
        
        button.outline:hover {
            background: rgba(139, 92, 246, 0.1);
        }

        .response-box {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 1.5rem;
            min-height: 100px;
            margin-top: 1rem;
            white-space: pre-wrap;
            color: #e2e8f0;
            font-size: 0.95rem;
            line-height: 1.6;
            border: 1px solid var(--glass-border);
            overflow-x: hidden;
        }

        .action-row {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .badge {
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            background: #10b981;
            color: black;
            font-weight: bold;
            display: inline-block;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="header">
                <h1>PulseAI</h1>
                <p>Knowledge Assistant</p>
            </div>

            <div class="panel">
                <form id="uploadForm" enctype="multipart/form-data">
                    <input type="text" id="docTitle" placeholder="Document Title" required>
                    <input type="file" id="docFile" accept=".pdf" required>
                    <button type="submit">
                        Upload Document
                        <div class="loader" id="uploadLoader"></div>
                    </button>
                </form>
            </div>

            <div class="card-list" id="docList">
                <!-- Documents injected here -->
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div id="selectionState" style="text-align:center; color: var(--text-muted); padding: 4rem;">
                Select or upload a document to begin interacting with the AI engine.
            </div>

            <div id="activeState" style="display: none; flex-direction: column; gap: 2rem;">
                <!-- Toolbar -->
                <div class="panel" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h2 id="currentDocTitle" style="margin: 0; display: inline-block;">Document Name</h2>
                        <span class="badge">Processed</span>
                    </div>
                    <div style="display: flex; gap: 1rem;">
                        <button class="outline" onclick="generateSummary()" style="width: auto;">📝 Summarize</button>
                        <button class="outline" onclick="generateQuiz()" style="width: auto;">🎯 Create Quiz</button>
                    </div>
                </div>

                <!-- Chat Panel -->
                <div class="panel">
                    <h2>💬 Ask questions about this document</h2>
                    <div style="display: flex; gap: 1rem;">
                        <input type="text" id="questionInput" placeholder="E.g. What are the key findings?" style="margin: 0;">
                        <button onclick="askQuestion()" style="width: 150px;">
                            Ask
                            <div class="loader" id="askLoader"></div>
                        </button>
                    </div>
                    <div class="response-box" id="chatResponse" style="display: none;"></div>
                </div>

                <!-- Generated Results Panel -->
                <div class="panel" id="resultsPanel" style="display: none;">
                    <h2 id="resultTitle">Result</h2>
                    <div class="response-box" id="resultContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let currentDocId = null;

        document.addEventListener('DOMContentLoaded', fetchDocuments);

        // Upload Form Handler
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('docTitle').value;
            const file = document.getElementById('docFile').files[0];
            const loader = document.getElementById('uploadLoader');
            const submitBtn = e.target.querySelector('button');
            
            if(!title || !file) return;

            const formData = new FormData();
            formData.append('title', title);
            formData.append('file', file);

            try {
                loader.style.display = 'block';
                submitBtn.disabled = true;
                const response = await fetch(`${API_BASE}/documents/upload/`, {
                    method: 'POST',
                    body: formData
                });
                
                if(response.ok) {
                    const data = await response.json();
                    document.getElementById('uploadForm').reset();
                    await fetchDocuments();
                    selectDocument(data.id, data.title);
                } else {
                    alert('Upload failed.');
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred.');
            } finally {
                loader.style.display = 'none';
                submitBtn.disabled = false;
            }
        });

        // Fetch Documents
        async function fetchDocuments() {
            try {
                const response = await fetch(`${API_BASE}/documents/list/`);
                const data = await response.json();
                
                const list = document.getElementById('docList');
                list.innerHTML = '';
                
                data.forEach(doc => {
                    const el = document.createElement('div');
                    el.className = `doc-item ${doc.id === currentDocId ? 'active' : ''}`;
                    el.onclick = () => selectDocument(doc.id, doc.title);
                    
                    const date = new Date(doc.uploaded_at).toLocaleDateString();
                    el.innerHTML = `
                        <h4 style="color: #fff; margin-bottom: 0.3rem;">${doc.title}</h4>
                        <span style="font-size: 0.8rem; color: var(--text-muted);">${date} • ${doc.is_processed ? 'Ready' : 'Processing'}</span>
                    `;
                    list.appendChild(el);
                });
            } catch (err) {
                console.error(err);
            }
        }

        // Select Document
        function selectDocument(id, title) {
            currentDocId = id;
            document.getElementById('selectionState').style.display = 'none';
            document.getElementById('activeState').style.display = 'flex';
            document.getElementById('currentDocTitle').innerText = title;
            document.getElementById('chatResponse').style.display = 'none';
            document.getElementById('resultsPanel').style.display = 'none';
            
            // Re-render list to show active state
            document.querySelectorAll('.doc-item').forEach(el => el.classList.remove('active'));
            fetchDocuments();
        }

        // Ask Question
        async function askQuestion() {
            const question = document.getElementById('questionInput').value;
            if(!question || !currentDocId) return;

            const loader = document.getElementById('askLoader');
            const respBox = document.getElementById('chatResponse');
            
            try {
                loader.style.display = 'block';
                respBox.style.display = 'block';
                respBox.innerText = 'Thinking...';
                
                const response = await fetch(`${API_BASE}/chat/ask/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        document_id: currentDocId,
                        question: question
                    })
                });
                
                const data = await response.json();
                respBox.innerText = data.answer || data.error || 'No response';
            } catch (err) {
                respBox.innerText = 'Error occurred connecting to the API.';
            } finally {
                loader.style.display = 'none';
            }
        }

        // Generate Summary
        async function generateSummary() {
            if(!currentDocId) return;
            showResultPanel('Summary', 'Generating summary... This may take a moment.');
            
            try {
                const response = await fetch(`${API_BASE}/documents/${currentDocId}/summary/`);
                const data = await response.json();
                document.getElementById('resultContent').innerText = data.summary || data.error;
            } catch (err) {
                document.getElementById('resultContent').innerText = 'Error generating summary.';
            }
        }

        // Generate Quiz
        async function generateQuiz() {
            if(!currentDocId) return;
            showResultPanel('Generated Quiz', 'Generating advanced AI quiz... Please wait.');
            
            try {
                const response = await fetch(`${API_BASE}/quiz/generate/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ document_id: currentDocId })
                });
                const data = await response.json();
                document.getElementById('resultContent').innerText = data.quiz || data.error;
            } catch (err) {
                document.getElementById('resultContent').innerText = 'Error generating quiz.';
            }
        }

        function showResultPanel(title, placeholder) {
            const panel = document.getElementById('resultsPanel');
            panel.style.display = 'block';
            document.getElementById('resultTitle').innerText = title;
            document.getElementById('resultContent').innerText = placeholder;
            panel.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
