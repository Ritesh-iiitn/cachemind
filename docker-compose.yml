version: '3.8'

services:
  backend:
    build:
      context: ./ai_doc_assistant
      dockerfile: Dockerfile.backend
    container_name: cachemind-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
      - LLAMA_CPP_BASE_URL=${LLAMA_CPP_BASE_URL:-http://localhost:8080}
      - USE_MOCK_LLM_IF_UNAVAILABLE=true
    volumes:
      - ./ai_doc_assistant/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./ai_doc_assistant/frontend
      dockerfile: Dockerfile.frontend
    container_name: cachemind-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cachemind_data:
